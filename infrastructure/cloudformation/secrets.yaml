AWSTemplateFormatVersion: '2010-09-09'
Description: 'Secrets Manager configuration for Calendar Service'

Parameters:
  Environment:
    Type: String
    Default: production
    AllowedValues:
      - production
      - staging
      - development
    Description: Environment name

  SpreadsheetId:
    Type: String
    NoEcho: true
    Description: Google Spreadsheet ID for calendar

  SupabaseUrl:
    Type: String
    NoEcho: true
    Description: Supabase URL for backup system

  SupabaseKey:
    Type: String
    NoEcho: true
    Description: Supabase anonymous key

Resources:
  CalendarServiceSecrets:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub 'calendar-service-secrets-${Environment}'
      Description: Secrets for Calendar Command Service
      SecretString: !Sub |
        {
          "SPREADSHEET_ID": "${SpreadsheetId}",
          "SUPABASE_URL": "${SupabaseUrl}",
          "SUPABASE_KEY": "${SupabaseKey}"
        }
      Tags:
        - Key: Environment
          Value: !Ref Environment
        - Key: Application
          Value: CalendarService

  # Secret rotation is not needed for these static credentials
  # But we can add it if Google/Supabase credentials need periodic rotation

Outputs:
  SecretArn:
    Description: ARN of the Secrets Manager secret
    Value: !Ref CalendarServiceSecrets
    Export:
      Name: !Sub '${AWS::StackName}-SecretArn'

  SecretName:
    Description: Name of the Secrets Manager secret
    Value: !Sub 'calendar-service-secrets-${Environment}'
    Export:
      Name: !Sub '${AWS::StackName}-SecretName'
